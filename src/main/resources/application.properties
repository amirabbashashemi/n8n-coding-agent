# Pivotal H2 Database Configuration

# H2 Database URL
spring.h2.database-url=jdbc:h2:mem:testdb

# Database username
spring.h2.username=sa

# Database password
spring.h2.password=

# Enable H2 console
spring.h2.console.enabled=true

